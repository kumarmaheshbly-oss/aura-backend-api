name: Aura Engine Automation

on:
  schedule:
    # Yeh har 6 ghante me chalega (UTC time me)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Isse aap manually bhi run kar sakte hain

jobs:
  run-engine:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Set up Java (Orekit ke liye zaroori hai)
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Engine Script
      run: python engine.py
